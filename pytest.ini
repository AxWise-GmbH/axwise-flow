[pytest]
testpaths = backend/tests
addopts = -m contract
asyncio_mode = auto
markers =
    unit: isolated test with no network or external service
    contract: API or schema contract test using in-process dependencies
    integration: test spanning multiple local components
    live: requires a separately running service
    manual: intended for explicit developer inspection
    llm: requires a real model provider and credentials
filterwarnings =
    ignore::DeprecationWarning
