# Cloud Build config for the AxWise frontend (axwise.de production).
#
# Builds frontend/Dockerfile with --target runner. Public NEXT_PUBLIC_* env
# vars are inlined into the client bundle by Next.js at build time, so we
# forward them as --build-arg values from substitutions. Substitution values
# are supplied by scripts/deploy-axwise-de-frontend.sh.

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--no-cache"
      - "-t"
      - "$_IMAGE_NAME"
      - "-f"
      - "frontend/Dockerfile"
      - "--target"
      - "runner"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL"
      - "--build-arg"
      - "NEXT_PUBLIC_ENABLE_CLERK_AUTH=$_NEXT_PUBLIC_ENABLE_CLERK_AUTH"
      - "--build-arg"
      - "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
      - "--build-arg"
      - "NEXT_PUBLIC_CLERK_DOMAIN=$_NEXT_PUBLIC_CLERK_DOMAIN"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_API_KEY=$_NEXT_PUBLIC_FIREBASE_API_KEY"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_NEXT_PUBLIC_FIREBASE_PROJECT_ID"
      - "--build-arg"
      - "NEXT_PUBLIC_ENABLE_FIREBASE_INTEGRATION=$_NEXT_PUBLIC_ENABLE_FIREBASE_INTEGRATION"
      - "--build-arg"
      - "NEXT_PUBLIC_PERSONAS_ONLY=$_NEXT_PUBLIC_PERSONAS_ONLY"
      - "--build-arg"
      - "NEXT_PUBLIC_ENABLE_MULTI_STAKEHOLDER=$_NEXT_PUBLIC_ENABLE_MULTI_STAKEHOLDER"
      - "--build-arg"
      - "NEXT_PUBLIC_MAX_STAKEHOLDERS=$_NEXT_PUBLIC_MAX_STAKEHOLDERS"
      - "--build-arg"
      - "NEXT_PUBLIC_STAKEHOLDER_CONFIDENCE_THRESHOLD=$_NEXT_PUBLIC_STAKEHOLDER_CONFIDENCE_THRESHOLD"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_IMAGE_NAME"]

substitutions:
  _IMAGE_NAME: ""
  _NEXT_PUBLIC_API_URL: "https://api.axwise.de"
  _NEXT_PUBLIC_ENABLE_CLERK_AUTH: "true"
  _NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
  _NEXT_PUBLIC_CLERK_DOMAIN: "axwise.de"
  _NEXT_PUBLIC_FIREBASE_API_KEY: ""
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: "axwise-73425"
  _NEXT_PUBLIC_ENABLE_FIREBASE_INTEGRATION: "true"
  _NEXT_PUBLIC_PERSONAS_ONLY: "true"
  _NEXT_PUBLIC_ENABLE_MULTI_STAKEHOLDER: "false"
  _NEXT_PUBLIC_MAX_STAKEHOLDERS: "10"
  _NEXT_PUBLIC_STAKEHOLDER_CONFIDENCE_THRESHOLD: "0.3"

images:
  - "$_IMAGE_NAME"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

