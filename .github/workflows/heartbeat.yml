name: Orqanix Hourly Heartbeat & Edge Health Check

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    name: Verify Edge Health & SLA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute Hourly Heartbeat Verification
        run: |
          node scripts/heartbeat-service.mjs

      - name: Upload Heartbeat Snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heartbeat-snapshot
          path: artifacts/heartbeat/
          retention-days: 7
