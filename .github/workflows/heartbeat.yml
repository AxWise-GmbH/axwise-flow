name: Orqanix Perpetual Heartbeat & Edge Health Check

on:
  schedule:
    # Run every 20 minutes perpetually
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    name: Verify Edge Health & SLA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute Heartbeat Verification & Generate Public Snapshot
        run: |
          node scripts/heartbeat-service.mjs
          # Copy sanitized public snapshot directly to web static public directory
          mkdir -p apps/orqaly/public-gcp/
          cp artifacts/heartbeat/latest.json apps/orqaly/public-gcp/heartbeat.json
          cp artifacts/heartbeat/latest.json apps/orqaly/public/heartbeat.json

      - name: Upload Heartbeat Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heartbeat-snapshot
          path: artifacts/heartbeat/
          retention-days: 7
