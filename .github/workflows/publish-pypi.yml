name: Publish to PyPI

on:
  push:
    tags:
      - 'axwise-extension-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build & Publish Python Wheel to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic httpx python-dotenv typing-inspection

      - name: Run verification test suite
        run: |
          python -m unittest discover -s backend/tests/local_axwise

      - name: Build deterministic distribution artifacts
        run: |
          python packages/axwise-distribution/build.py --source-root $(pwd) --output /tmp/dist

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: /tmp/dist/artifacts
          skip-existing: true
        continue-on-error: true

      - name: Publish to PyPI (API Token Fallback)
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload --skip-existing /tmp/dist/artifacts/*.whl /tmp/dist/artifacts/*.tar.gz -u __token__ -p "${PYPI_API_TOKEN}"
