permissions:
  contents: read

defaults:
  run:
    working-directory: apps/orqaly

concurrency:
  group: workflow-v2-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-gates:
    name: Pure engine, real PostgreSQL, UI and immutable builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: preview_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: preview_test_only
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      VITE_ORQALY_API_URL: https://orqaly-v2-api-preview.example.invalid
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/orqaly/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify measured evaluation records, fixtures, publication and dashboard contracts
        run: node --test ../../scripts/agent-evaluations/*.test.mjs

      - name: Run Orqanix connector and multi-file refactor benchmark regression gates
        run: |
          node --test ../../packages/orqaly-goose-connector/test/*.test.mjs
          node --test ../../scripts/benchmark-multi-file-ts-refactor.test.mjs
          node --test ../../scripts/gavel-ci-pr-review.test.mjs

      - name: Verify declarative baseline inventory
        run: npm run verify:workflow-v2-schema

      - name: Run workflow contracts, state machine, fault, UI and release tests
        run: npm run test:workflow-v2:release

      - name: Run retained GCP workspace, routes, navigation and assistant rendering tests
        run: >-
          npm exec -- vitest run --maxWorkers=1
          src/pages/GcpWorkspace
          src/pages/Standart
          src/gcp-routes
          src/components/Auth/GcpClerkGate
          src/components/Layout/Gcp
          src/components/Layout/gcpNav
          src/components/VoiceControl/AssistantMarkdown
          src/components/VoiceControl/CollapsibleMarkdownDocument

      - name: Run production account website and publication boundary tests
        run: >-
          npm exec -- vitest run --maxWorkers=1
          src/account-routes
          src/pages/Account
          src/pages/Auth/GcpAuthPage
          src/components/Auth/ClerkOnDemand
          src/components/Auth/clerk-config
          scripts/legal-publication

      - name: Create isolated real-PostgreSQL test databases
        run: |
          createdb --host=127.0.0.1 --username=postgres workflow_v2_structural
          createdb --host=127.0.0.1 --username=postgres workflow_v2_api
          createdb --host=127.0.0.1 --username=postgres workflow_v2_e2e_simple
          createdb --host=127.0.0.1 --username=postgres workflow_v2_e2e_advanced

      - name: Prove baseline, RLS and structural tenant invariants on PostgreSQL 16
        env:
          WORKFLOW_V2_TEST_DATABASE_URL: postgresql://postgres:preview_test_only@127.0.0.1:5432/workflow_v2_structural
          WORKFLOW_V2_APPLY_BASELINE: '1'
        run: npm run test:workflow-v2:pg

      - name: Prove authenticated API idempotency on PostgreSQL 16
        env:
          WORKFLOW_V2_API_TEST_DATABASE_URL: postgresql://postgres:preview_test_only@127.0.0.1:5432/workflow_v2_api
          WORKFLOW_V2_APPLY_BASELINE: '1'
        run: npm run test:workflow-v2:api-pg

      - name: Run the fresh Simple thin vertical on PostgreSQL 16
        env:
          WORKFLOW_V2_E2E_DATABASE_URL: postgresql://postgres:preview_test_only@127.0.0.1:5432/workflow_v2_e2e_simple
          WORKFLOW_V2_APPLY_BASELINE: '1'
          WORKFLOW_V2_E2E_MODE: simple
        run: npm run test:workflow-v2:e2e-local

      - name: Run the fresh Advanced thin vertical on PostgreSQL 16
        env:
          WORKFLOW_V2_E2E_DATABASE_URL: postgresql://postgres:preview_test_only@127.0.0.1:5432/workflow_v2_e2e_advanced
          WORKFLOW_V2_APPLY_BASELINE: '1'
          WORKFLOW_V2_E2E_MODE: advanced
        run: npm run test:workflow-v2:e2e-local

      - name: Lint changed workflow boundary
        run: >-
          npx eslint
          lib/workflow-v2
          shared/workflow-v2
          server/workflow-v2
          src/workflow-v2
          src/pages/WorkflowV2
          scripts/workflow-v2-*.mjs
          scripts/workflow-v2-*.test.js

      - name: Build and audit the isolated Simple and Advanced web application
        working-directory: apps/orqaly/deploy/workflow-v2/web-package
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run verify
          npm audit --omit=dev

      - name: Build deployment images without publishing
        run: |
          docker build --pull \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="$VITE_CLERK_PUBLISHABLE_KEY" \
            --build-arg VITE_ORQALY_API_URL="$VITE_ORQALY_API_URL" \
            -f deploy/workflow-v2/Dockerfile.web \
            -t orqaly-v2-web:test \
            .
          docker build --pull -f deploy/workflow-v2/Dockerfile.service -t orqaly-v2-service:test .

  capability-postgres:
    name: Explicit capability PostgreSQL boundary (${{ matrix.owner-login }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        owner-login: [NOLOGIN, LOGIN]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: capability_025_admin
          POSTGRES_DB: orqaly_capability_025_ci
          # This service exists only inside this isolated credential-free test job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capability_025_admin -d orqaly_capability_025_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/orqaly/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Prove capability roles, consent, persistence and legacy compatibility
        env:
          WORKFLOW_V2_CAPABILITY_DISPOSABLE_APPROVED: new_empty_loopback_only
          WORKFLOW_V2_CAPABILITY_DISPOSABLE_DATABASE_URL: postgresql://capability_025_admin@127.0.0.1:5432/orqaly_capability_025_ci
          WORKFLOW_V2_CAPABILITY_TEST_OWNER_LOGIN: ${{ matrix.owner-login }}
          WORKFLOW_V2_CAPABILITY_PG_RECEIPT: ${{ runner.temp }}/capability-postgres-receipt.json
        run: node scripts/workflow-v2-capability-postgres.mjs
