activities:
- Initialize test workspace and logging infrastructure
- Test file operations (create, read, update, delete, undo)
- Validate shell command execution and error handling
- Validate Azure AI Foundry provider routing and deployment aliases
- Validate the configurable Databricks AI Gateway path across all inference routes
- Analyze code structure and parsing capabilities
- Validate optional native engineering tools in the current Goose loop
- Test extension discovery and management
- Test load tool for knowledge injection and discovery
- Test delegate tool for task delegation (sync and async)
- Test multi-turn thinking preservation for providers that reject replayed reasoning_content
- Validate ACP thinking-effort discovery, forwarding, and provider switching
- Validate GDK observability hook lifecycle events and payload opt-in
- Test error boundaries including nested delegation prevention
- Generate comprehensive test report
author:
  contact: goose-self-test
parameters:
- key: test_phases
  input_type: string
  requirement: optional
  description: 'Which test phases to run: all, basic, native-engineering, extensions, delegation, reasoning, acp-effort, advanced'
  default: all
- key: test_depth
  input_type: string
  requirement: optional
  description: 'Testing depth: quick (smoke tests), standard (normal coverage), deep (exhaustive)'
  default: standard
- key: workspace_dir
  input_type: string
  requirement: optional
  description: Directory for test artifacts and results
  default: ./gooseselftest
- key: parallel_tests
  input_type: string
  requirement: optional
  description: Run independent tests in parallel where possible
  default: 'true'
- key: cleanup_after
  input_type: string
  requirement: optional
  description: Clean up test artifacts after completion
  default: 'true'

