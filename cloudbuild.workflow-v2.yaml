steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--pull"
      - "-t"
      - "$_IMAGE_NAME"
      - "-f"
      - "backend/Dockerfile.workflow-v2"
      - "backend"
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_IMAGE_NAME"]
images:
  - "$_IMAGE_NAME"
options:
  logging: GCS_ONLY
  machineType: "E2_HIGHCPU_8"
