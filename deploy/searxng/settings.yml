use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - duckduckgo
      - google

general:
  instance_name: AxWise SearXNG

search:
  safe_search: 1
  formats:
    - json

# Several upstream engines ship disabled by default. keep_only narrows the
# configured engine set but does not enable a disabled engine, so make the four
# bounded secondary routes explicit. Runtime diagnostics still surface quota,
# CAPTCHA, and suspension failures; Gemini grounding remains independent.
engines:
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: google
    disabled: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
