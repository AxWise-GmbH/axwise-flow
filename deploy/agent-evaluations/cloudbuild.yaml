steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--pull"
      - "--platform=linux/amd64"
      - "-t"
      - "$_IMAGE_NAME"
      - "-f"
      - "deploy/agent-evaluations/Dockerfile"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_IMAGE_NAME"]
images:
  - "$_IMAGE_NAME"
options:
  logging: CLOUD_LOGGING_ONLY
