version: "1.0.0"
title: "jev-use: Fast TypeSafe Computer Use"
description: "Accelerated desktop and browser computer use with TypeSafe AI System-1 decision routing and Cua Driver."
instructions: |
  Execute desktop and browser computer-use workflows using the accelerated jev-use loop:
  1. Application & Window Activation: Ensure the target application is focused on the frontmost display (`bring_to_front` or OS activation) so WindowServer dispatches hardware-level pointer events reliably.
  2. Perception & Coordinate Mapping: Inspect the UI with `cua-driver__get_window_state`, `list_windows`, or web viewport bounds. Calculate exact Retina desktop pixel coordinates taking into account toolbars (`outerHeight - innerHeight`).
  3. Candidate Action Extraction: Extract candidate interactive controls into a clean bounded list.
  4. TypeSafe AI Decision: Evaluate candidate actions against the goal using TypeSafe AI System-1 (https://api.typesafe.ai/v1/systemone with TYPESAFE_API_KEY) in ~200-350ms with mathematical probability guarantees.
  5. Physical Execution: Execute visible, smooth physical mouse movements (`move_cursor` with ease-in-out curve), clicks (`click`), drags for ranges/drawing/reordering (`drag`), and typing (`type_text` / `hotkey`).
  6. Verification: Confirm the postcondition visually or via state readback.
prompt: "Automate the requested computer use task using the fast jev-use decision loop."
activities:
  - "Open application and click target button using jev-use"
  - "Fill form in browser using accelerated Cua Driver"
  - "Navigate between desktop windows and verify outcome"
