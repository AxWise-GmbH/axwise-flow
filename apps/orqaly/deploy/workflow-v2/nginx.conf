server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    return 200 'ok';
  }

  location = /readyz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    return 200 'ready';
  }

  # Legacy relative API paths must fail closed. The launch client calls the
  # explicit GCP API origin baked into its verified bundle.
  location = /api {
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    return 404 'not found';
  }

  location ^~ /api/ {
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    return 404 'not found';
  }

  # Only Vite's content-hashed build artifacts are immutable. Public files that
  # happen to live below /assets retain revalidation semantics.
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|png|jpe?g|gif|svg|webp|avif|woff2?|ttf)$" {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    return 410;
  }

  location = /manifest.json {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /heartbeat.json {
    # The collector publishes one public, status-only object. Keep the upstream
    # path fixed and discard browser query strings so this cannot become an
    # open GCS proxy.
    limit_except GET HEAD {
      deny all;
    }

    include /etc/nginx/security-headers.conf;
    default_type application/json;
    proxy_pass https://storage.googleapis.com/orqanix-heartbeat-preview-161074549006/latest.json?;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name storage.googleapis.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host storage.googleapis.com;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_set_header Transfer-Encoding "";

    proxy_connect_timeout 3s;
    proxy_send_timeout 3s;
    proxy_read_timeout 8s;
    proxy_intercept_errors off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /index.html {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  # React Router owns every non-file path, including direct deep links.
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}
