server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    return 200 'ok';
  }

  location = /readyz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    return 200 'ready';
  }

  # Legacy relative API paths must fail closed. The launch client calls the
  # explicit GCP API origin baked into its verified bundle.
  location = /api {
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    return 404 'not found';
  }

  location ^~ /api/ {
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    return 404 'not found';
  }

  # Only Vite's content-hashed build artifacts are immutable. Public files that
  # happen to live below /assets retain revalidation semantics.
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|png|jpe?g|gif|svg|webp|avif|woff2?|ttf)$" {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    return 410;
  }

  location = /manifest.json {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  # React Router owns every non-file path, including direct deep links.
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}
