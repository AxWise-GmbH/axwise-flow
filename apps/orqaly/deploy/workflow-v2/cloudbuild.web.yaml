steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["CLERK_PUBLISHABLE_KEY"]
    args:
      - "-ceu"
      - |
        docker build --pull \
          --build-arg "VITE_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY" \
          --build-arg "VITE_ORQALY_API_URL=$_ORQALY_API_URL" \
          -t "$_IMAGE_NAME" \
          -f deploy/workflow-v2/Dockerfile.web \
          .
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_IMAGE_NAME"]
images:
  - "$_IMAGE_NAME"
availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/orqaly-v2-preview-001-clerk-publishable-key/versions/$_CLERK_PUBLISHABLE_KEY_VERSION"
      env: "CLERK_PUBLISHABLE_KEY"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
