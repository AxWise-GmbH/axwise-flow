steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["CLERK_PUBLISHABLE_KEY"]
    args:
      - "-ceu"
      - |
        docker build --pull \
          --build-arg "VITE_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY" \
          --build-arg "VITE_ORQALY_API_URL=$_ORQALY_API_URL" \
          --build-arg "VITE_CLERK_ENVIRONMENT=$_CLERK_ENVIRONMENT" \
          --build-arg "VITE_ORQALY_API_ENVIRONMENT=$_ORQALY_API_ENVIRONMENT" \
          -t "$_IMAGE_NAME" \
          -f deploy/workflow-v2/Dockerfile.web \
          .
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_IMAGE_NAME"]
images:
  - "$_IMAGE_NAME"
availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/$_CLERK_PUBLISHABLE_KEY_SECRET/versions/$_CLERK_PUBLISHABLE_KEY_VERSION"
      env: "CLERK_PUBLISHABLE_KEY"
substitutions:
  # Existing preview release scripts need no changes. Production must override
  # both environment declarations, the key secret and the API URL together.
  _CLERK_ENVIRONMENT: "preview"
  _ORQALY_API_ENVIRONMENT: "preview"
  _CLERK_PUBLISHABLE_KEY_SECRET: "orqaly-v2-preview-001-clerk-publishable-key"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
