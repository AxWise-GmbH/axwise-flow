steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--pull'
      - '-t'
      - '$_IMAGE_NAME'
      - '-f'
      - 'infra/gcp/agentic-preview/control-plane.Dockerfile'
      - 'services/agentic-control-plane'
images:
  - '$_IMAGE_NAME'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
