server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Cloud Run terminates TLS before port 8080. Keep local redirects relative.
  absolute_redirect off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; script-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control "public, max-age=300" always;
  error_page 404 /404.html;
  error_page 410 /retired/index.html;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location ~ ^/(sign-in|sign-up|login|signup)(/|$) { return 302 https://orqanix.com/login; }
  location ~ ^/docs(/|$) { return 302 "https://github.com/AxWise-GmbH/axwise-flow#install-from-a-release"; }
  location ~ ^/(use-cases|b2b|customer-research)/?$ { return 302 "/#examples"; }
  location ~ ^/(unified-dashboard|dashboard|axpersona|prototypes|precall|app)(/|$) { return 410; }
  location / { try_files $uri $uri/ =404; }
}
